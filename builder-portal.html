<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCPS Builder Portal</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Same palette and type as startup-request.html — builders see one product. */
    :root {
      --teal: #0D3D3E;
      --aqua: #1FA7A8;
      --aqua-light: #5ED6D3;
      --gray: #F3F5F6;
      --ink: #222222;
      --muted: #5c6b6b;
      --line: #d8e2e4;
      --danger: #b42318;
      --ok-bg: #ecfdf3;
      --ok-ink: #067647;
      --warn-bg: #fffbeb;
      --warn-ink: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--gray);
      color: var(--ink);
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
    }
    h1, h2, h3 { font-family: 'Montserrat', Arial, sans-serif; }
    h2 { margin: 4px 0 8px; font-size: 24px; color: var(--teal); }

    /* ── Top bar ── */
    #b-topbar { display: none; background: var(--teal); color: #fff; }
    .b-topbar-inner {
      max-width: 860px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    }
    .b-brand-name { display: block; font-family: 'Montserrat', Arial, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
    .b-brand-sub { display: block; font-size: 11px; color: var(--aqua-light); font-weight: 600; margin-top: 2px; }
    .b-nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .b-nav-item {
      background: transparent; border: 1px solid rgba(255,255,255,.25); color: #fff;
      border-radius: 999px; padding: 6px 13px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .b-nav-item:hover { border-color: var(--aqua-light); color: var(--aqua-light); }
    .b-nav-item.active { background: var(--aqua); border-color: var(--aqua); }

    /* ── Layout ── */
    .b-wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px 64px; }
    #b-auth {
      display: none; max-width: 460px; margin: 8vh auto; background: #fff;
      border: 1px solid var(--line); border-radius: 12px; padding: 28px;
      box-shadow: 0 18px 50px rgba(13, 61, 62, .12);
    }
    #b-app { display: none; }
    .b-card {
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      padding: 20px; margin-bottom: 18px;
    }
    .b-center { text-align: center; }
    .b-eyebrow { color: var(--aqua); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-family: 'Montserrat', Arial, sans-serif; }
    .b-muted { color: var(--muted); line-height: 1.55; }
    .b-small { font-size: 13px; }
    .b-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .b-headrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .b-back { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 0 12px; }
    .b-back:hover { color: var(--aqua); }

    /* ── Tiles ── */
    .b-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
    .b-tile { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
    .b-tile-n { font-family: 'Montserrat', Arial, sans-serif; font-weight: 800; font-size: 26px; color: var(--teal); line-height: 1.1; }
    .b-tile-l { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .b-tile.pending .b-tile-n { color: var(--warn-ink); }
    .b-tile.approved .b-tile-n { color: var(--ok-ink); }
    .b-tile.rejected .b-tile-n { color: var(--danger); }

    /* ── Grouped list ── */
    .b-group { margin-bottom: 22px; }
    .b-group-title { font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--teal); margin-bottom: 8px; font-family: 'Montserrat', Arial, sans-serif; }
    .b-row {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 13px 15px; margin-bottom: 8px; cursor: pointer; text-align: left; font: inherit;
    }
    .b-row:hover { border-color: var(--aqua); }
    .b-row-name { font-weight: 700; color: var(--ink); }
    .b-row-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .b-row-side { text-align: right; flex-shrink: 0; }
    .b-row-date { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .b-row-flag { font-size: 12px; color: var(--warn-ink); font-weight: 600; margin-top: 4px; }

    .b-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .b-pill.pending { background: var(--warn-bg); color: var(--warn-ink); }
    .b-pill.approved { background: var(--ok-bg); color: var(--ok-ink); }
    .b-pill.rejected { background: #fef3f2; color: var(--danger); }

    /* ── Detail ── */
    .b-detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .b-photos { margin: 14px 0; display: flex; gap: 10px; flex-wrap: wrap; }
    .b-photos img { max-height: 190px; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
    .b-spec { margin-top: 14px; border-top: 1px solid var(--gray); }
    .b-spec-row { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--gray); font-size: 14px; }
    .b-spec-k { color: var(--muted); font-weight: 600; flex-shrink: 0; }
    .b-spec-v { text-align: right; word-break: break-word; }

    /* ── Forms ── */
    .b-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .b-field label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .b-field input, .b-field textarea {
      border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
      font: inherit; font-size: 14px; background: #fff; color: var(--ink); width: 100%;
    }
    .b-field input:focus, .b-field textarea:focus { outline: 2px solid var(--aqua-light); border-color: var(--aqua); }
    .b-field input:disabled { background: var(--gray); color: var(--muted); }
    textarea { resize: vertical; }

    .b-btn {
      display: inline-block; border: 1px solid var(--aqua); border-radius: 8px;
      padding: 11px 18px; font-family: 'Open Sans', Arial, sans-serif; font-weight: 700; font-size: 14px;
      background: #fff; color: var(--aqua); cursor: pointer; text-decoration: none;
    }
    .b-btn.primary { background: var(--aqua); color: #fff; }
    .b-btn:disabled { opacity: .55; cursor: default; }

    .b-msg { display: none; border-radius: 8px; padding: 11px 13px; margin-bottom: 12px; font-weight: 600; font-size: 14px; }
    .b-msg:not(:empty) { display: block; }
    .b-msg.err { background: #fef3f2; color: var(--danger); }
    .b-msg.ok { background: var(--ok-bg); color: var(--ok-ink); }
    .b-notice { border: 1px solid var(--aqua-light); background: #f0fbfb; border-radius: 8px; padding: 11px 13px; margin: 12px 0; font-size: 14px; line-height: 1.5; }
    .b-notice.ok { border-color: #a6e9c5; background: var(--ok-bg); color: var(--ok-ink); }
    .b-notice.warn { border-color: #fcd9a5; background: var(--warn-bg); color: var(--warn-ink); }

    .b-spinner {
      width: 40px; height: 40px; margin: 26px auto;
      border: 4px solid var(--gray); border-top-color: var(--aqua);
      border-radius: 50%; animation: b-spin .9s linear infinite;
    }
    @keyframes b-spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .b-tiles { grid-template-columns: 1fr; }
      .b-row { flex-direction: column; align-items: flex-start; }
      .b-row-side { text-align: left; }
      .b-headrow .b-btn { width: 100%; text-align: center; }
      #b-auth { margin: 4vh auto; padding: 22px; }
    }
  </style>
</head>
<body>
  <header id="b-topbar"></header>

  <div class="b-wrap">
    <div id="b-auth"></div>
    <div id="b-app"></div>
  </div>

  <script src="/js/lib/constants.js"></script>
  <script src="/js/lib/api.js"></script>
  <script src="/js/builder/builder-api.js"></script>
  <script src="/js/builder/builder-auth.js"></script>
  <script src="/js/builder/builder-dashboard.js"></script>
  <script src="/js/builder/builder-app.js"></script>
</body>
</html>
