<title>Lifecycle Email</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Oswald:wght@600;700&display=swap">
<style>
/* Layout: the portal's admin page — title bar, underline tabs, chip row, card tables; a right drawer and a centered wizard sheet sit above it. */
:root{
  --bg:#F5F4EB; --card:#ffffff; --surface:#f8fafc; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --teal:#0d4d44; --teal-mid:#1a7a6e; --teal-light:#2aa89a; --accent:#0d4d44; --gold:#c8a84b;
  --btn:#0d4d44; --btn-text:#ffffff; --tint:rgba(42,168,154,.10); --scrim:rgba(15,23,42,.45);
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --info:#075985; --info-bg:#e0f2fe; --idle:#475569; --idle-bg:#f1f5f9;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-display:'Oswald','Arial Narrow',Arial,sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --shadow:0 2px 8px rgba(0,0,0,.08); --shadow-lg:0 12px 40px rgba(0,0,0,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --card:#17201e; --surface:#131b19; --text:#e5ece9; --muted:#94a5a1; --border:#2a3633;
  --accent:#4cc3b3; --btn:#1f8a7c; --btn-text:#ffffff; --tint:rgba(76,195,179,.12); --scrim:rgba(0,0,0,.6);
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14); --bad:#f87171; --bad-bg:rgba(248,113,113,.14);
  --info:#7dd3fc; --info-bg:rgba(125,211,252,.13); --idle:#a3b1ae; --idle-bg:rgba(148,165,161,.13);
  --shadow:0 2px 8px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1513; --card:#17201e; --surface:#131b19; --text:#e5ece9; --muted:#94a5a1; --border:#2a3633;
  --accent:#4cc3b3; --btn:#1f8a7c; --btn-text:#ffffff; --tint:rgba(76,195,179,.12); --scrim:rgba(0,0,0,.6);
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14); --bad:#f87171; --bad-bg:rgba(248,113,113,.14);
  --info:#7dd3fc; --info-bg:rgba(125,211,252,.13); --idle:#a3b1ae; --idle-bg:rgba(148,165,161,.13);
  --shadow:0 2px 8px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal-light);outline-offset:2px}

.mock-note{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-cond);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);padding:3px 10px;border-radius:999px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin:10px 0 14px}
.top h1{font-family:var(--f-display);font-size:28px;letter-spacing:.01em;margin:0;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted)}
.status-strip{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.04em;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.test{background:var(--warn-bg);color:var(--warn)}
.pill.sender{background:var(--info-bg);color:var(--info)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-cond);font-size:12px;background:var(--idle-bg);color:var(--idle);border-radius:999px;padding:1px 7px;margin-left:6px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--border);background:var(--card);border-radius:999px;padding:5px 12px;font-family:var(--f-cond);font-weight:700;font-size:14px;letter-spacing:.03em;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.chip strong{color:var(--text);font-variant-numeric:tabular-nums}
.chip.active{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.btn{border:1.5px solid var(--border);background:var(--card);border-radius:var(--r-sm);padding:8px 14px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--teal-light)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1606}
.btn.small{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 6px}
.card-h h3{margin:0;font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.card-h small{color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-family:var(--f-cond);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:700}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--tint)}
td.num,th.num{text-align:right}
tfoot td{font-weight:700;border-top:2px solid var(--border);border-bottom:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.em-name{font-weight:700}
.em-sub{font-size:12.5px;color:var(--muted)}

.tag{display:inline-block;font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.06em;padding:2px 8px;border-radius:5px;white-space:nowrap}
.t-live{background:var(--ok-bg);color:var(--ok)}
.t-pending{background:var(--warn-bg);color:var(--warn)}
.t-missing{background:var(--bad-bg);color:var(--bad)}
.t-info{background:var(--info-bg);color:var(--info)}
.t-idle{background:var(--idle-bg);color:var(--idle)}
.bucket{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:5px;font-family:var(--f-cond);font-weight:700;font-size:13px;background:var(--tint);color:var(--accent)}

.switch{position:relative;width:38px;height:22px;border-radius:999px;border:0;background:var(--border);padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.switch.on{background:var(--teal-light)}
.switch.on::after{left:19px}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--card);z-index:41;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-h{padding:16px 18px 10px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dr-h h2{margin:0;font-family:var(--f-display);font-size:22px}
.dr-h .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.x{border:0;background:var(--surface);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.dr-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);overflow-x:auto}
.dr-tabs .tab{padding:9px 12px;font-size:14px}
.dr-body{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.section-t{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.group{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.group-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface);font-weight:700;font-size:14px}
.group ul{list-style:none;margin:0;padding:0}
.group li{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-top:1px solid var(--border);font-size:14px}
.group li .r{color:var(--muted);text-align:right}
.empty{padding:8px 12px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--border)}

/* Funnel + sparkline */
.funnel{display:flex;flex-direction:column;gap:7px}
.f-row{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.f-track{height:14px;background:var(--surface);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.f-fill{height:100%;background:var(--teal-light);border-radius:3px}
.f-row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.f-row .v small{color:var(--muted);font-weight:500}

/* Wizard */
.sheet{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(940px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.sheet-scrim{z-index:50}
.wz-h{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 18px 0}
.wz-h h2{margin:0;font-family:var(--f-display);font-size:21px}
.stepper{display:flex;gap:6px;padding:12px 18px 12px;border-bottom:1px solid var(--border);overflow-x:auto}
.st{display:flex;align-items:center;gap:7px;border:0;background:none;padding:6px 10px 6px 6px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap}
.st .c{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-cond);font-weight:700;font-size:13px;border:1.5px solid var(--border);background:var(--card)}
.st.done .c{background:var(--teal-light);border-color:var(--teal-light);color:#fff}
.st.cur{background:var(--tint);color:var(--accent)}
.st.cur .c{border-color:var(--accent);color:var(--accent)}
.wz-body{padding:18px;overflow-y:auto;flex:1}
.wz-f{display:flex;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.cols.c32{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>label,.field>.lbl{font-weight:600;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.inp{border:1.5px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;width:100%;min-width:0}
.inp:focus{outline:none;border-color:var(--teal-mid);background:var(--card)}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline .inp{width:auto}
.inp.n{width:76px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.ck{display:inline-flex;gap:7px;align-items:center;border:1.5px solid var(--border);border-radius:999px;padding:5px 11px;font-size:14px;background:var(--card)}
.ck input{accent-color:var(--teal-mid);margin:0}
.ck.on{border-color:var(--teal-light);background:var(--tint)}
.big-count{display:flex;align-items:baseline;gap:8px;padding:14px 14px 4px}
.big-count b{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--accent)}
.sentence{background:var(--tint);border-radius:var(--r-sm);padding:10px 12px;font-size:15px}
.err{color:var(--bad)}
.okc{color:var(--ok)}
.checklist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.mf{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mf button{border:1px dashed var(--border);background:var(--surface);border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:2px 7px;color:var(--accent)}

/* Timeline (sequence) */
.tl{position:relative;height:96px;margin:6px 8px 4px}
.tl-line{position:absolute;left:0;right:0;top:40px;height:2px;background:var(--border)}
.tl-pt{position:absolute;top:31px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:96px;text-align:center}
.tl-pt i{width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--teal-light)}
.tl-pt.me i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,168,75,.25)}
.tl-pt span{font-size:12px;line-height:1.2}
.tl-pt b{font-family:var(--f-cond);font-size:12px;color:var(--muted);position:absolute;top:-22px;white-space:nowrap}
.tl-axis{display:flex;justify-content:space-between;font-family:var(--f-cond);font-size:12px;color:var(--muted)}

/* Contact timeline */
.ctl{list-style:none;margin:0;padding:0;position:relative}
.ctl li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:6px 0;font-size:14px;align-items:start}
.ctl .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--f-cond)}
.ctl time{color:var(--muted);font-size:13px;white-space:nowrap}

/* Email preview (an email is always light — deliberate fixed palette) */
.preview-frame{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:#E9EDEE;max-height:560px;overflow-y:auto}
.preview-meta{font-size:13px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);display:grid;gap:2px}
.preview-meta b{font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);z-index:80;box-shadow:var(--shadow-lg);font-weight:600;max-width:calc(100% - 32px)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.cfg{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:4px 16px 16px;font-size:14px}
.cfg dt{color:var(--muted)}
.cfg dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.callout{border:1px solid var(--border);border-left:4px solid var(--gold);background:var(--card);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;margin-bottom:14px}

/* v3: tracking detail, evidence confidence, engine controls */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface);min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;font-weight:600}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.conf{display:inline-block;font-family:var(--f-cond);font-weight:700;font-size:11.5px;letter-spacing:.05em;padding:1px 7px;border-radius:999px;white-space:nowrap}
.conf.high{background:var(--ok-bg);color:var(--ok)}
.conf.medium{background:var(--info-bg);color:var(--info)}
.conf.low{background:var(--idle-bg);color:var(--idle)}
.rcp{border-top:1px solid var(--border)}
.rcp:first-of-type{border-top:0}
.rcp summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 12px;cursor:pointer;list-style:none;align-items:center}
.rcp summary::-webkit-details-marker{display:none}
.rcp summary:hover{background:var(--tint)}
.rcp .badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.rcp .evlist{padding:0 12px 10px}
.rcp table td,.rcp table th{padding:6px 8px;font-size:13px}
.snippet{font-style:italic;color:var(--muted)}
tr.deferred td{opacity:.6}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:4px 16px 14px}
.ctrl label{display:inline-flex;gap:9px;align-items:center;font-weight:600}
.health{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 16px 14px;font-size:13.5px;color:var(--muted)}
.health b{color:var(--ok);font-weight:700}
.att{list-style:none;margin:0;padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.att li{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.att li.unknown{border-left-color:var(--bad)}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols,.cols.c32,.grid2{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .sheet{top:0;left:0;transform:none;width:100%;max-height:100%;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .hide-sm{display:none}
  .tl-pt{width:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

];
const STATUS_LABEL = {active:'Active',paused:'Paused',replied:'Replied',clicked:'Clicked quote',form_submitted:'Form submitted',converted:'Converted',opted_out:'Opted out'};

const TEMPLATES = [
  {file:'B - MCP Legacy/intro.html', bucket:'B', status:'LIVE', body:
`<h1>The Mission continues.</h1>
<p>Hi {{FirstName}},</p>
<p>Mission Custom Pools built your pool, and we want it to keep looking the way it did on day one. Mission Custom Pool Solutions is our service company, run by the same family that builds our pools.</p>

function shiftDays(s, n, unit){

  let x = s, left = Math.abs(n); const step = n<0 ? -1 : 1;
  while (left > 0) { x = addDays(x, step); const dow = D(x).getUTCDay(); if (dow!==0 && dow!==6) left--; }

function planContact(c, list){

      const base = baseDate(e, c, prevDate);
      const due = base ? (e.anchor==='monthly' ? base : shiftDays(base, e.offset + k*e.repeatEvery, e.unit)) : null;
      const row = {c, e, key, label, due, status:'', reason:''};
      if (c.sent[key]) { row.status='sent'; row.date=c.sent[key]; prevDate=c.sent[key]; rows.push(row); return; }
      prevDate = due;
      if (c.review!=='confirmed') { row.status='excluded'; row.reason='Needs review'; }
      else if (c.status!=='active') { row.status='excluded'; row.reason=STATUS_LABEL[c.status]; }
      else if (c.inflight && c.inflight[key]) { row.status='excluded'; row.reason = c.inflight[key].state==='cancelled' ? 'Cancelled by operator' : 'Needs attention (send outcome unclear)'; }
      else if (PAUSE.all) { row.status='excluded'; row.reason='Engine paused'; }
      else if (PAUSE[c.bucket]) { row.status='excluded'; row.reason='Bucket '+c.bucket+' paused'; }
      else if (!e.active) { row.status='excluded'; row.reason='Email is a draft'; }
      else if (tplStatus(e)!=='LIVE') { row.status='excluded'; row.reason='Template not approved'; }
      else if (e.subs.length && !e.subs.includes(sub)) { row.status='excluded'; row.reason='Sub-bucket '+sub; }

// ───────────────────────── Cadence in plain English ─────────────────────────
const EVENT_PHRASE = {inquiry:'an inquiry comes in', proposal_sent:'their proposal is sent', service_milestone:'a positive service milestone', referral:'a referral comes in'};
const ord = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
// "Day N" the way the notebook counts it: Day 1 is the day they're confirmed.
function chainDay(e, list){
  let day = null;
  for (const x of chainFor(e.bucket, list||EMAILS)) {
    if (x.unit==='business') day = null;
    else if (x.anchor==='enrollment') day = x.offset + 1;
    else if (x.anchor==='previous' && day!=null) day += x.offset;
    else day = null;
    if (x.id===e.id) return day;
  }
  return null;
}
function cadenceText(e, list){
  // Where the notebook gives a range ("1–3 days before", "60–90 days", "2–3
  // business days"), the send window is that range, so say it that way.
  const ranged = e.window>0 && e.repeatCount<2 && ((e.anchor==='startup' && e.offset<0) || e.offset>=30 || (e.anchor==='event' && e.unit==='business'));
  const n = Math.abs(e.offset), unitW = e.unit==='business' ? 'business day' : 'day';
  const lo = e.offset<0 ? Math.max(0, n - e.window) : n, hi = e.offset<0 ? n : n + e.window;
  const d = ranged ? `${lo}–${hi} ${unitW}s` : n + ' ' + unitW + (n===1?'':'s');
  const dayN = ranged ? null : chainDay(e, list);
  let s;
  if (e.anchor==='tbd') return 'Timing to be decided';
  if (e.anchor==='monthly') s = `Monthly, on the ${ord(e.monthDay)}`;
  else if (e.anchor==='enrollment') s = e.offset===0 ? 'Day 1, when they’re confirmed' : `${d} after they’re confirmed` + (dayN?` (day ${dayN})`:'');
  else if (e.anchor==='startup') s = e.offset===0 ? 'On the startup date' : e.offset<0 ? `${d} before startup` : `${d} after startup`;
  else if (e.anchor==='event') s = e.offset===0 ? `The same day ${EVENT_PHRASE[e.event]||'the event happens'}` : `${d} after ${EVENT_PHRASE[e.event]||'the event'}`;
  else { const prev = chainFor(e.bucket, list||EMAILS).filter(x=>x.step<e.step).pop(); s = (dayN?`Day ${dayN} · `:'') + `${d} after ${prev?prev.name:'the previous email'}`; }
  if (e.repeatCount>1 && e.anchor!=='monthly') s += `, then every ${e.repeatEvery} days (${e.repeatCount} total)`;
  return s;
}
function stopText(e){ const m = Object.fromEntries(STOPS); return e.stops.length ? 'Stops if ' + e.stops.map(s=>m[s].replace(/^They /,'they ').replace(/^Their /,'their ')).join(', ').replace(/, ([^,]*)$/,', or $1') : 'Never stops early'; }

  return { rows, sent:sent.length, due:rows.filter(r=>r.status==='due').length, next:rows.filter(r=>in30(r)||r.status==='later').length,
    blocked:rows.filter(r=>r.status==='blocked').length,

function copyCsv(e, s){

function blockReason(i){

  if (i===4 && activateBlock()) return activateBlock();

}
function canLeave(i){ return i===4 || !blockReason(i); }
function activateBlock(){ const d=WZ.d; if(!d.template) return 'Needs a template before it can go live.'; if(unknownFields(d).length) return 'Unknown merge fields.'; return ''; }
function wzClick(ev){

  const g = t.closest('[data-goto]'); if (g && !g.disabled){ const k=+g.dataset.goto; if (k<=WZ.step || [...Array(k).keys()].every(canLeave)) { WZ.step=k; drawWizard(); } return; }

function wzInput(ev){

  else if (['offset','repeatEvery','repeatCount','window','step','monthDay'].includes(k)) d[k] = parseInt(t.value||'0',10)||0;

function cadenceSummary(){
  const d = WZ.d; const list = wzList();

  const pts = []; let prev = 0;
  chain.forEach(e=>{ occKeys(e).forEach((key,k)=>{ const day = (e.anchor==='previous'? prev : 0) + e.offset + k*e.repeatEvery; pts.push({e,k,day}); prev = day; }); });
  const min = Math.min(0,...pts.map(p=>p.day)), max = Math.max(1,...pts.map(p=>p.day));
  const pos = v => 4 + (v-min)/(max-min)*92;

  // notebook's way, where day 1 is the day they're confirmed.
  const fromStartup = chain.some(e=>e.anchor==='startup');
  if (!fromStartup) pts.forEach(p=>p.day += 1);

  const samples = CONTACTS.filter(c=>c.bucket===d.bucket && c.review==='confirmed').flatMap(c=>planContact(c,list)).filter(r=>r.e.id===d.id).slice(0,3);

      ${pts.map((p,ix)=>`<div class="tl-pt ${p.e.id===d.id?'me':''}" style="left:${pos(p.day)}%;${ix%2?'top:31px':''}"><b>day ${p.day}</b><i></i><span>${esc((p.e.name||'This email'))}${p.e.repeatCount>1?' '+(p.k+1):''}</span></div>`).join('')}

}

  const c = CONTACTS.find(x=>x.id===sel.value);
  document.getElementById('wz-preview').innerHTML = renderEmail(d,c);
  document.getElementById('wz-subj-pv').innerHTML = merge(esc(d.subject),c);
  document.getElementById('wz-checks').innerHTML = contentChecks(d,c);
  const msg=document.getElementById('wz-msg'); if(msg) msg.textContent = blockReason(3)||'';
  const nx=document.querySelector('[data-next]'); if(nx) nx.disabled=!canLeave(3);
}
function uploadBody(file){
  const r = new FileReader();
  r.onload = () => { const folder = WZ.d.bucket==='B'?'B - MCP Legacy':WZ.d.bucket==='C'?'C - MCP New':WZ.d.bucket+' - '+BUCKETS[WZ.d.bucket].name;
    const name = folder+'/'+file.name; TEMPLATES = TEMPLATES.filter(t=>t.file!==name);
    TEMPLATES.push({file:name, bucket:WZ.d.bucket, status:'PENDING', body:String(r.result)}); WZ.d.template=name; WZ.tplChanged=true;
    toast(`${file.name} uploaded to Pending.`); drawWizard(); };
  r.readAsText(file);
}
function wzReview(){
  const d = WZ.d; const list = wzList();
  const rows = CONTACTS.filter(c=>c.bucket===d.bucket).flatMap(c=>planContact(c, list.map(e=> e.id===d.id? {...e, active:true} : e))).filter(r=>r.e.id===d.id);
  // Count as if approved and on, so the summary shows what activating would do.
  const tpl = tplFor(d); const was = tpl && tpl.status; if (tpl) tpl.status='LIVE';
  const live = CONTACTS.filter(c=>c.bucket===d.bucket).flatMap(c=>planContact(c, list.map(e=> e.id===d.id? {...e, active:true} : e))).filter(r=>r.e.id===d.id);
  if (tpl) tpl.status = was;
  const recv = live.filter(r=>['due','upcoming','later'].includes(r.status));
  const firsts = live.filter(r=>r.status==='upcoming').sort((a,b)=>a.due.localeCompare(b.due));
  const dueNext = live.filter(r=>r.status==='due').length;
  return `<div class="cols">
    <div class="card" style="padding:16px">
      <div class="section-t">Summary</div>
      <dl class="kv">
        <dt>Email</dt><dd><b>${esc(d.name)}</b></dd>
        <dt>Bucket</dt><dd><span class="bucket">${d.bucket}</span> ${esc(BUCKETS[d.bucket].name)}${d.subs.length?' · '+d.subs.join(', '):''}</dd>
        <dt>Recipients</dt><dd><b>${people(recv)}</b> contacts · <b>${dueNext}</b> on the next run (${fmtLong(TODAY)}, 9:00 AM)</dd>
        <dt>First upcoming</dt><dd>${firsts[0]? fmtLong(firsts[0].due)+' · '+esc(fullName(firsts[0].c)) : '—'}</dd>
        <dt>When</dt><dd>${esc(cadenceText(d, list))}</dd>
        <dt>Stops</dt><dd>${esc(stopText(d))}</dd>
        <dt>Subject</dt><dd>${esc(d.subject)}</dd>
        <dt>Template</dt><dd>${d.template? tplTag(tplStatus(d))+' <span class="muted small">'+esc(d.template)+'</span>' : '<span class="err">None</span>'}</dd>
      </dl>
    </div>
    <div class="stack">
      <div class="callout"><b>Approve &amp; activate</b> moves the template from Pending to Live and turns the email on. It starts with the next run.<br><br><b>Save as draft</b> keeps it off. Nobody receives anything.</div>
      ${WZ.src && WZ.src.active ? `<div class="callout">Changing timing never re-sends an email someone already got. Each contact gets each email once, tracked in the send log.</div>`:''}
      ${dueNext>3? `<div class="callout">Daily cap is 50 emails. ${dueNext} are due now and fit under it.</div>`:''}
    </div></div>`;
}
function saveWizard(activate){
  const d = WZ.d; delete d._new;
  if (activate) { const t=tplFor(d); if (t) t.status='LIVE'; d.active=true; }
  else d.active = false;
  // Keep step numbers tidy inside the bucket.
  const others = chainFor(d.bucket, EMAILS.filter(e=>e.id!==d.id));
  others.splice(d.step-1, 0, d); others.forEach((e,k)=>e.step=k+1);
  EMAILS = [...EMAILS.filter(e=>e.id!==d.id && e.bucket!==d.bucket), ...others];
  toast(activate ? `${d.name} approved and on. It starts with the next run.` : `${d.name} saved as a draft.`);
  WZ = null; TAB='emails'; closeOverlay();
}

// ───────────────────────── Contacts tab ─────────────────────────
function nextFor(c){ const r = planContact(c, EMAILS).find(r=>['due','later','upcoming','blocked'].includes(r.status)); return r; }
function lastActivity(c){
  const short = {open:'Opened', click:'Clicked', reply:'Replied to', unsubscribe:'Unsubscribed from'};
  const dates = [...Object.entries(c.sent).map(([k,d])=>({d,t:'Sent '+labelForKey(k)})),
    ...evsOf(c).filter(v=>short[v.type] && !(v.conf==='low') && !(v.type==='click'&&v.conf!=='high')).map(v=>({d:v.date, t:short[v.type]+' '+labelForKey(v.key)}))];
  return dates.sort((a,b)=>b.d.localeCompare(a.d))[0];
}
function labelForKey(k){ const [id,n] = k.split('#'); const e = EMAILS.find(x=>x.id===id); return e ? e.name+(n?' '+n:'') : k; }
function viewContacts(){
  const count = f => CONTACTS.filter(f).length;
  const chips = [
    ['all','All',()=>true], ['review','Needs review',c=>c.review==='needs_review'],
    ['B','B · MCP Legacy',c=>c.bucket==='B'], ['C','C · MCP New',c=>c.bucket==='C'],
    ['active','Active',c=>c.review==='confirmed'&&c.status==='active'], ['replied','Replied',c=>c.status==='replied'],
    ['clicked','Clicked',c=>c.status==='clicked'], ['paused','Paused',c=>c.status==='paused'], ['opted_out','Opted out',c=>c.status==='opted_out'],
  ];
  const f = (chips.find(x=>x[0]===CHIP)||chips[0])[2];
  const list = CONTACTS.filter(f);
  const reviewQ = CONTACTS.filter(c=>c.review==='needs_review');
  document.getElementById('view').innerHTML = `
  ${reviewQ.length && CHIP!=='review' ? `<div class="callout"><b>${reviewQ.length} contacts need review</b> before they can be emailed: ${reviewQ.map(c=>esc(fullName(c))).join(', ')}. <button class="btn link" data-chip="review">Review now</button></div>`:''}
  <div class="bar"><div class="chips">${chips.map(([k,l,fn])=>`<button class="chip ${CHIP===k?'active':''}" data-chip="${k}">${l} <strong>${count(fn)}</strong></button>`).join('')}</div>
    <button class="btn primary" onclick="toast('Add contact opens a form (mockup).')">+ Add contact</button></div>
  <div class="card scroll"><table>
    <thead><tr><th>Name</th><th>Bucket</th><th>Status</th><th>Next email</th><th class="hide-sm">Last activity</th><th></th></tr></thead>
    <tbody>${list.map(c=>{ const n = nextFor(c); const la = lastActivity(c);
      return `<tr class="click" data-contact="${c.id}">
        <td><div class="em-name">${esc(fullName(c))}</div><div class="em-sub">${esc(c.email)}</div></td>
        <td><span class="bucket">${c.bucket}</span> <span class="small muted">${c.sub||(c.startup?'startup '+fmt(c.startup):'')}${c.pool_school==='Y'?' · pool school':''}</span></td>
        <td>${c.review==='needs_review'?'<span class="tag t-pending">NEEDS REVIEW</span>':`<span class="tag ${c.status==='active'?'t-live':c.status==='opted_out'?'t-missing':'t-idle'}">${esc(STATUS_LABEL[c.status]).toUpperCase()}</span>`}</td>
        <td class="small">${n? `${esc(n.label)} · ${n.status==='due'?'<b>today</b>':n.status==='blocked'?'<span class="err">blocked</span>':n.status==='later'?'next run':fmt(n.due)}` : '<span class="muted">—</span>'}</td>
        <td class="small muted hide-sm">${la? esc(la.t)+' · '+fmt(la.d) : '—'}</td>
        <td>${c.review==='needs_review'?`<button class="btn small primary" data-confirm="${c.id}">Confirm</button>`:''}</td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">No contacts match.</td></tr>'}</tbody></table></div>`;
}
function confirmContact(id){
  const c = CONTACTS.find(x=>x.id===id); c.review='confirmed'; if (!c.start) c.start=TODAY;
  const n = nextFor(c);
  toast(`${c.first} confirmed. ${n? n.label+(n.status==='due'?' goes out on the next run.':' is scheduled for '+fmt(n.due)+'.') : ''}`);
  render();
}
function openContactDrawer(id){
  const c = CONTACTS.find(x=>x.id===id);
  const items = [
    ...(c.start? [{d:c.start, t:'Confirmed into bucket '+c.bucket, k:'in'}]:[]),
    ...Object.entries(c.sent).map(([k,d])=>({d, t:'Sent · '+labelForKey(k), k:'sent'})),
    ...evsOf(c).map(v=>({d:v.date, time:v.time, t:labelForKey(v.key)+' · '+evText(v), k: v.type==='click'&&v.conf!=='high' ? 'scan' : v.type, v})),
  ].sort((a,b)=>(b.d+(b.time||'')).localeCompare(a.d+(a.time||'')));
  const icon = {in:['+','t-idle'], sent:['→','t-info'], open:['◉','t-idle'], click:['↗','t-live'], scan:['·','t-idle'], reply:['↩','t-live'], auto_reply:['↺','t-idle'], unsubscribe:['×','t-missing']};
  const plan = planContact(c, EMAILS).filter(r=>r.status!=='sent');
  document.getElementById('overlay').innerHTML = `
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-label="${esc(fullName(c))}">
    <div class="dr-h"><div><h2>${esc(fullName(c))}</h2><div class="sub">${esc(c.email)} · ${esc(c.address||'no address on file')}</div></div><button class="x" data-close aria-label="Close">×</button></div>
    <div class="dr-body">
      <dl class="kv">
        <dt>Bucket</dt><dd><select class="inp" id="cd-bucket" style="width:auto">${Object.entries(BUCKETS).map(([k,b])=>`<option value="${k}" ${c.bucket===k?'selected':''}>${k} · ${b.name}</option>`).join('')}</select> ${c.sub?`<span class="tag t-info">${c.sub}</span>`:''}</dd>
        <dt>Status</dt><dd>${c.review==='needs_review'?'<span class="tag t-pending">NEEDS REVIEW</span>':`<span class="tag t-idle">${esc(STATUS_LABEL[c.status]).toUpperCase()}</span>`}</dd>
        ${c.startup?`<dt>Startup date</dt><dd>${fmtLong(c.startup)}</dd><dt>Pool school</dt><dd>${c.pool_school==='Y'?'Yes · '+esc(c.pool_school_date):'No'}</dd>`:''}
      </dl>
      <div class="inline">
        ${c.review==='needs_review'?`<button class="btn primary small" data-cact="confirm">Confirm</button>`:''}
        ${c.status==='active'?`<button class="btn small" data-cact="pause">Pause</button>`:c.status==='paused'?`<button class="btn small" data-cact="resume">Resume</button>`:''}
        <button class="btn small" data-cact="convert">Mark converted (→ A)</button>
        ${c.status!=='opted_out'?`<button class="btn small" data-cact="unsub" style="color:var(--bad)">Unsubscribe</button>`:''}
      </div>
      <div><div class="section-t">Coming up</div><div class="group"><ul>${plan.length? plan.map(r=>`<li><span>${esc(r.label)}</span><span class="r">${r.status==='due'?'<b>next run</b>':r.status==='upcoming'?fmtLong(r.due):r.status==='blocked'?'<span class="err">'+esc(r.reason)+'</span>':esc(r.reason)}</span></li>`).join(''):'<li class="muted">Nothing left in this sequence.</li>'}</ul></div></div>
      <div><div class="section-t">Timeline</div><ul class="ctl">${items.map(i=>`<li><span class="ic tag ${icon[i.k][1]}">${icon[i.k][0]}</span><span>${esc(i.t)} ${i.v?confTag(i.v):''}</span><time>${fmt(i.d)}${i.time?' '+esc(i.time):''}</time></li>`).join('') || '<li class="muted">Nothing yet.</li>'}</ul></div>
      ${c.bucket==='C' && c.ev.some(v=>v[0]==='reply') ? '<div class="callout">Replies from startup customers don’t stop their emails. They’re flagged to Tony as customer conversations.</div>':''}
    </div>
  </aside>`;
  const ov = document.getElementById('overlay');
  ov.onclick = ev => {
    if (ev.target.closest('[data-close]')) return closeOverlay();
    const a = ev.target.closest('[data-cact]'); if (!a) return;
    const k = a.dataset.cact;
    if (k==='confirm') { c.review='confirmed'; if(!c.start) c.start=TODAY; toast(c.first+' confirmed.'); }
    if (k==='pause') { c.status='paused'; toast(c.first+' paused. No emails until resumed.'); }
    if (k==='resume') { c.status='active'; toast(c.first+' resumed.'); }
    if (k==='convert') { c.bucket='A'; c.sub=''; c.status='converted'; toast(c.first+' moved to A · Current customers. Sequence stopped.'); }
    if (k==='unsub') { c.status='opted_out'; if (c.bucket==='B') c.sub='B4'; c.ev.push(['unsubscribe', Object.keys(c.sent).pop()||'', TODAY]); toast(c.first+' unsubscribed and added to the opt-out list.'); }
    openContactDrawer(id);
  };
  ov.onchange = ev => { if (ev.target.id==='cd-bucket'){ c.bucket=ev.target.value; c.sub = c.bucket==='B'?'B1':''; toast(`${c.first} moved to bucket ${c.bucket}. Old sequence stopped.`); openContactDrawer(id); } };
}

// ───────────────────────── Activity tab ─────────────────────────
function viewActivity(){
  const rows = allRows();
  const q = rows.filter(r=>['due','later','blocked'].includes(r.status)).sort((a,b)=>({due:0,later:1,blocked:2})[a.status]-({due:0,later:1,blocked:2})[b.status]);
  const recent = rows.filter(r=>r.status==='sent').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  const att = CONTACTS.flatMap(c=>Object.entries(c.inflight||{}).filter(([,d])=>d.state!=='cancelled').map(([key,d])=>({c,key,d})));
  const sw = (k,label) => `<label><button class="switch ${PAUSE[k]?'':'on'}" data-pause="${k}" aria-pressed="${!PAUSE[k]}" aria-label="${label}"></button>${label} <span class="muted small">${PAUSE[k]?'paused':'running'}</span></label>`;
  document.getElementById('view').innerHTML = `
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Engine</h3><small>it’s ${NOW_TIME} · test mode</small></div>
    <div class="ctrl">${sw('all','Whole engine')}${sw('B','B · MCP Legacy')}${sw('C','C · MCP New')}</div>
    <div class="health"><span>Last successful run: <b>today 9:06 AM</b></span><span>Independent health check: <b>OK</b> at 10:00 AM yesterday</span><span>Sending as: <b>antonio@</b> (verified)</span></div></div>
  ${att.length?`<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Needs attention</h3><small>${att.length} send${att.length>1?'s':''} with an unclear outcome · never retried automatically</small></div>
    <ul class="att">${att.map(({c,key,d})=>`<li class="${d.state}"><div class="inline" style="justify-content:space-between"><span><b>${esc(fullName(c))}</b> · ${esc(labelForKey(key))}</span>
        <span class="tag ${d.state==='unknown'?'t-missing':'t-pending'}">${d.state==='unknown'?'NEEDS A DECISION':'CHECKING'}</span></div>
      <span class="small">Send started ${esc(d.authorized)}. ${esc(d.note)}</span>
      ${d.state==='unknown'?`<div class="inline"><button class="btn small" data-recon="${c.id}|${key}|mark">It was sent</button>
        <button class="btn small" disabled title="Locked until any earlier attempt has definitely finished">Resend · unlocks ${esc(d.unlock)}</button>
        <button class="btn small" data-recon="${c.id}|${key}|cancel">Don’t send</button></div>
        <span class="muted small">Check Tony’s Sent folder for “${esc(fullName(c))}” first. Resend stays locked until ${esc(d.unlock)}, so an earlier attempt can’t still be going out.</span>`
      : '<span class="muted small">Nothing to do yet. If no copy shows up, this moves to “needs a decision”.</span>'}</li>`).join('')}</ul></div>`:''}
  <div class="grid2">
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Next run · ${fmtLong(TODAY)}, 9:00 AM</h3><button class="btn primary small" data-run>Run now</button></div>
        <div class="scroll"><table><thead><tr><th>Contact</th><th>Email</th><th>Goes to</th><th>Status</th></tr></thead>
        <tbody>${q.length? q.map(r=>`<tr class="click" data-contact="${r.c.id}"><td>${esc(fullName(r.c))}</td><td>${esc(r.label)}</td><td class="small">${TEST_TO}<br><span class="muted">for ${esc(r.c.email)}</span></td>
          <td>${r.status==='due'?'<span class="tag t-live">SENDS</span>':r.status==='later'?'<span class="tag t-idle">TOMORROW</span><div class="em-sub">1 email per day</div>':'<span class="tag t-missing">BLOCKED</span><div class="em-sub err">'+esc(r.reason)+'</div>'}</td></tr>`).join('')
          : `<tr><td colspan="4" class="muted">${PAUSE.all?'The engine is paused. Nothing will send until you resume it.':'Nobody is due. Run now will send nothing.'}</td></tr>`}</tbody></table></div></div>
      <div class="card"><div class="card-h"><h3>Recently sent</h3><small>send log</small></div><div class="scroll"><table><thead><tr><th>When</th><th>Contact</th><th>Email</th></tr></thead>
        <tbody>${recent.map(r=>`<tr class="click" data-contact="${r.c.id}"><td>${fmt(r.date)}</td><td>${esc(fullName(r.c))}</td><td>${esc(r.label)}</td></tr>`).join('')}</tbody></table></div></div>
    </div>
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Runs</h3><small>last 5</small></div><div class="scroll"><table><thead><tr><th>Run</th><th class="num">Sent</th><th class="num">Skipped</th><th class="num">Failed</th></tr></thead>
        <tbody>${RUNS.slice(0,5).map(r=>`<tr><td class="small">${esc(r.at)}<div class="em-sub">${esc(r.why)}</div></td><td class="num">${r.sent}</td><td class="num">${r.skipped}</td><td class="num ${r.failed?'err':''}">${r.failed}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><div class="card-h"><h3>Errors</h3></div><ul class="ctl" style="padding:0 16px 12px">
        ${q.filter(r=>r.status==='blocked').map(r=>`<li><span class="ic tag t-missing">!</span><span><b>${esc(fullName(r.c))}</b> · ${esc(r.label)}: ${esc(r.reason)}. Add it on the contact to unblock.</span><time>today</time></li>`).join('')}
        <li><span class="ic tag t-missing">!</span><span><b>Oct 23</b> · Gmail rejected one send (temporary). Retried and sent Oct 24.</span><time>Oct 23</time></li></ul></div>
      <div class="card"><div class="card-h"><h3>Settings</h3><small>Config sheet</small></div><dl class="cfg">
        <dt>Daily send cap</dt><dd>50</dd><dt>Test mode</dt><dd>On</dd><dt>Test inbox</dt><dd>${TEST_TO}</dd>
        <dt>Runs</dt><dd>Daily at 9:00 AM<div class="em-sub" style="font-weight:400">Switches to hourly when New Leads goes live, so inquiry replies can go out the same day.</div></dd><dt>Sends as</dt><dd>${SENDER.email}</dd><dt>Gmail reserve</dt><dd>200 kept for Tony’s own mail</dd>
        <dt>Per person</dt><dd>1 lifecycle email a day<div class="em-sub" style="font-weight:400">Also holds if a Comms campaign emailed them today (best-effort).</div></dd></dl></div>
    </div>
  </div>`;
}
function reconAction(cid, key, act){
  const c = CONTACTS.find(x=>x.id===cid);
  if (act==='mark') { c.sent[key]=TODAY; delete c.inflight[key]; toast(`Marked as sent. ${c.first}’s sequence continues from today.`); }
  if (act==='cancel') { c.inflight[key].state='cancelled'; toast(`Won’t send ${labelForKey(key)} to ${c.first}. Logged in the change history.`); }
  render();
}
function simulateRun(){
  if (PAUSE.all) { toast('The engine is paused. Nothing was sent.'); return; }
  const due = allRows().filter(r=>r.status==='due');
  due.forEach(r=>{ r.c.sent[r.key]=TODAY; if (r.e.onSendSub) r.c.sub=r.e.onSendSub; });
  const skipped = allRows().filter(r=>r.status==='later').length;
  RUNS.unshift({at:'Oct 26 · now', sent:due.length, skipped, failed:0, why: due.length? 'Done' : 'Nothing new to send (no double-sends)'});
  toast(due.length ? `Run finished: ${due.length} sent to the test inbox, ${skipped} wait for tomorrow.` : 'Run finished: 0 sent. Everyone due today already got their email.');
  render();
}

// ───────────────────────── Boot ─────────────────────────
const h = (location.hash||'').slice(1); if (TABS.some(t=>t[0]===h)) TAB=h;
render();
</script>
